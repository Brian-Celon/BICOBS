<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier Sign-In &bull; Taurus POS Terminal</title>
    <link rel="stylesheet" href="/frontend/css/POS.css">
    <link rel="icon" type="image/png" href="/frontend/Pictures/logo.png">
</head>
<body class="pos_login_wrap">

    <div class="pos_login_card">
        <!-- header banner -->
        <div class="pos_login_header">
            <img src="/frontend/Pictures/logo.png" alt="Taurus Logo" class="pos_login_logo" onerror="this.src='/frontend/Pictures/logo.jpg'">
            <h1 class="pos_login_title">TAURUS POINT OF SALE</h1>
            <p class="pos_login_subtitle">Store Counter Checkout &amp; Workshop Dispatch</p>
            <div style="font-size: 11px; color: #fecdd3; margin-top: 8px; font-weight: 600;">
                <span id="clock_display">12:00:00 PM</span> &bull; Terminal #01 (Marilao)
            </div>
        </div>

        <!-- login body -->
        <div class="pos_login_body">
            <!-- alert banner -->
            <div id="login_error_banner" style="display: none; background: #fff1f2; border: 1px solid #fecdd3; color: #b91c1c; padding: 10px 14px; border-radius: 8px; font-size: 12.5px; line-height: 1.4;">
                <strong id="login_error_text">Invalid email or password</strong>
            </div>

            <form id="cashier_login_form">
                <div class="pos_login_field">
                    <label class="pos_login_label" for="login_email">Cashier / Staff Email</label>
                    <input type="email" class="pos_login_input" id="login_email" placeholder="e.g. russel@taurusbike.ph" required autocomplete="username">
                </div>

                <div class="pos_login_field" style="margin-top: 12px;">
                    <label class="pos_login_label" for="login_password">Terminal Password</label>
                    <div class="pos_password_wrap">
                        <input type="password" class="pos_login_input" id="login_password" placeholder="Enter password" required autocomplete="current-password">
                        <button type="button" class="pos_btn_toggle_pass" id="btn_toggle_pass" aria-label="Toggle password visibility" title="Show or hide password">
                            <svg class="icon_eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon_eye_off" style="display: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn_start_shift" id="btn_submit_login">
                    Start Cashier Shift &rarr;
                </button>
            </form>
        </div>
    </div>


    <!-- pos scripts -->
    <script src="/frontend/js/POS.js"></script>
</body>
</html>
