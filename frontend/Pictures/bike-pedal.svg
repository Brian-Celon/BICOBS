<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 120" width="100%" height="100%">
  <!-- Bike Cleat / Pedal Illustration -->
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="spindleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <!-- Spindle / Axle -->
  <rect x="15" y="55" width="40" height="10" rx="3" fill="url(#spindleGrad)" />
  <rect x="25" y="53" width="8" height="14" rx="2" fill="#475569" />
  <!-- Pedal Body Cage (Platform / Clipless combo) -->
  <polygon points="50,30 130,25 140,85 55,95" fill="url(#metalGrad)" stroke="#334155" stroke-width="2" stroke-linejoin="round" />
  <!-- Inner Cutouts / Vents -->
  <polygon points="65,42 90,40 88,60 66,62" fill="#ffffff" />
  <polygon points="98,39 125,37 122,60 97,60" fill="#ffffff" />
  <polygon points="68,68 90,67 87,83 67,84" fill="#ffffff" />
  <polygon points="98,67 121,66 118,80 97,81" fill="#ffffff" />
  <!-- Cleat Mechanism Center -->
  <rect x="85" y="48" width="18" height="24" rx="3" fill="#64748b" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="94" cy="55" r="2.5" fill="#e2e8f0"/>
  <circle cx="94" cy="65" r="2.5" fill="#e2e8f0"/>
</svg>
