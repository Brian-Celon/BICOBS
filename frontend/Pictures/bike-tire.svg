  </defs>
  <!-- Tire Arc / Profile facing forward -->
  <rect x="52" y="10" width="36" height="98" rx="18" fill="url(#tireGrad)" />
  <!-- Tread Knobs Center -->
  <g fill="#52525b">
    <rect x="66" y="18" width="8" height="4" rx="1" />
    <rect x="66" y="28" width="8" height="4" rx="1" />
    <rect x="66" y="38" width="8" height="4" rx="1" />
    <rect x="66" y="48" width="8" height="4" rx="1" />
    <rect x="66" y="58" width="8" height="4" rx="1" />
    <rect x="66" y="68" width="8" height="4" rx="1" />
    <rect x="66" y="78" width="8" height="4" rx="1" />
    <rect x="66" y="88" width="8" height="4" rx="1" />
    <rect x="66" y="98" width="8" height="4" rx="1" />
    <!-- Shoulder Knobs -->
    <rect x="55" y="23" width="6" height="4" rx="1" />
    <rect x="79" y="23" width="6" height="4" rx="1" />
    <rect x="55" y="43" width="6" height="4" rx="1" />
    <rect x="79" y="43" width="6" height="4" rx="1" />
    <rect x="55" y="63" width="6" height="4" rx="1" />
    <rect x="79" y="63" width="6" height="4" rx="1" />
    <rect x="55" y="83" width="6" height="4" rx="1" />
    <rect x="79" y="83" width="6" height="4" rx="1" />
  </g>
  <!-- Rim edge inside / shadow -->
  <ellipse cx="70" cy="104" rx="14" ry="4" fill="#18181b" opacity="0.6"/>
